name: Deploy to MonsterASP

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build and Publish
      run: dotnet publish Miscshopify/Miscshopify.csproj -c Release -o ./publish

    # Генерира чист appsettings.json с GitHub Secrets преди FTP качването
    - name: Create Production appsettings.json
      run: |
        cat <<EOF > ./publish/appsettings.json
        {
          "Logging": {
            "LogLevel": {
              "Default": "Information",
              "Microsoft.AspNetCore": "Warning"
            }
          },
          "AllowedHosts": "*",
          "ConnectionStrings": {
            "MiscshopifyContextConnection": "${{ secrets.DB_CONNECTION_STRING }}",
            "DefaultConnection": "${{ secrets.DB_CONNECTION_STRING }}"
          },
          "Stripe": {
            "SecretKey": "${{ secrets.STRIPE_SECRET_KEY }}",
            "PublishableKey": "${{ secrets.STRIPE_PUBLISHABLE_KEY }}"
          },
          "StripeSettings": {
            "SecretKey": "${{ secrets.STRIPE_SECRET_KEY }}",
            "PublishableKey": "${{ secrets.STRIPE_PUBLISHABLE_KEY }}"
          }
        }
        EOF

    - name: FTP Deploy
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./publish/
        server-dir: /wwwroot/
